org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The Flutter Gradle plugin still reads the old DSL interface; AGP 9 defaults to the new one.
android.newDsl=false
# Plugins such as image_picker_android still apply the kotlin-android plugin, which AGP 9 built-in Kotlin rejects.
android.builtInKotlin=false
