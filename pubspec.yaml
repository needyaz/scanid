name: scanid
description: "Free, open-source on-device OCR, barcode scanning, and document-edge detection, plus AAMVA driver's-license and ICAO MRZ decoders. No server calls, no license fee."
version: 0.1.0
homepage: https://github.com/needyaz/scanid
repository: https://github.com/needyaz/scanid

environment:
  sdk: ^3.11.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.needyaz.scanid
        pluginClass: ScanidPlugin
      ios:
        pluginClass: ScanidPlugin
